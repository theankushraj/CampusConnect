services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: campusconnect
      MYSQL_USER: campus
      MYSQL_PASSWORD: campus
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ucampus", "-pcampus"]
      interval: 8s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "5000"
      NODE_ENV: production
      JWT_SECRET: change-this-to-a-long-random-string
      DATABASE_HOST: mysql
      DATABASE_PORT: "3306"
      DATABASE_USER: campus
      DATABASE_PASSWORD: campus
      DATABASE_NAME: campusconnect
      FRONTEND_ORIGIN: "*"
      UPLOAD_DIR: /app/uploads
      SEED_DEMO_DATA: "true"
    ports:
      - "3000:5000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
  uploads_data:
